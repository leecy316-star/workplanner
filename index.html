<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 계획표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f3;--bg3:#ededea;
  --text:#1a1a18;--text2:#6b6b67;--text3:#9e9e9a;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --info-bg:#e6f1fb;--info-text:#0c447c;
  --danger-bg:#fcebeb;--danger-text:#a32d2d;
  --warn-bg:#faeeda;--warn-text:#854f0b;
  --ok-bg:#eaf3de;--ok-text:#3b6d11;
  --radius:8px;--radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1c1c1a;--bg2:#252522;--bg3:#2e2e2b;
    --text:#f0f0ee;--text2:#9e9e9a;--text3:#6b6b67;
    --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
    --info-bg:#042c53;--info-text:#b5d4f4;
    --danger-bg:#501313;--danger-text:#f7c1c1;
    --warn-bg:#412402;--warn-text:#fac775;
    --ok-bg:#173404;--ok-text:#c0dd97;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);min-height:100vh}
.container{max-width:960px;margin:0 auto;padding:2rem 1rem}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:12px}
.logo{font-size:18px;font-weight:600;color:var(--text)}
.logo span{font-weight:400;color:var(--text2);font-size:14px;margin-left:8px}
.add-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.add-btn:hover{opacity:0.85}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1.5rem}
.stat{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.stat-val{font-size:22px;font-weight:600;color:var(--text)}
.section-label{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;margin-top:1.5rem}
.week-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:0.5rem}
.day-col{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.day-head{background:var(--bg2);padding:7px 10px;font-size:11px;font-weight:600;color:var(--text2);text-align:center;border-bottom:0.5px solid var(--border)}
.day-head.today{color:#185fa5}
.day-tasks{padding:8px;min-height:64px;display:flex;flex-direction:column;gap:4px}
.day-chip{font-size:10px;padding:3px 7px;border-radius:4px;color:#fff;line-height:1.4;word-break:keep-all}
.day-load{font-size:10px;text-align:center;padding:4px;color:var(--text3);border-top:0.5px solid var(--border)}
.task-list{display:flex;flex-direction:column;gap:10px}
.task-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;border-left-width:3px;border-left-style:solid;border-left-color:#888}
.task-card.urgent{border-left-color:#e24b4a}
.task-card.warn{border-left-color:#ef9f27}
.task-card.ok{border-left-color:#1d9e75}
.task-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px}
.task-name{font-size:14px;font-weight:500;color:var(--text);flex:1}
.task-actions{display:flex;gap:6px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;padding:2px 4px;line-height:1;border-radius:4px}
.icon-btn:hover{background:var(--bg2);color:var(--text)}
.task-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:var(--radius);font-size:11px;font-weight:500}
.badge-urgent{background:var(--danger-bg);color:var(--danger-text)}
.badge-warn{background:var(--warn-bg);color:var(--warn-text)}
.badge-ok{background:var(--ok-bg);color:var(--ok-text)}
.progress-row{margin-top:10px;display:flex;align-items:center;gap:8px}
.prog-bg{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width .3s}
.prog-label{font-size:11px;color:var(--text2);min-width:30px;text-align:right}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:14px}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--bg);border:0.5px solid var(--border2);border-radius:var(--radius-lg);padding:1.5rem;width:min(460px,100%);max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1.25rem;color:var(--text)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 11px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#378add;box-shadow:0 0 0 2px rgba(55,138,221,0.2)}
.form-row textarea{resize:vertical;min-height:60px}
.range-row{display:flex;align-items:center;gap:10px}
.range-row input[type=range]{flex:1;accent-color:#378add}
.range-val{font-size:13px;font-weight:500;color:var(--text);min-width:36px;text-align:right}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:1.25rem}
.btn-cancel{padding:8px 16px;border:0.5px solid var(--border2);border-radius:var(--radius);background:none;cursor:pointer;font-size:13px;color:var(--text2);font-family:inherit}
.btn-cancel:hover{background:var(--bg2)}
.btn-save{padding:8px 16px;border:none;border-radius:var(--radius);background:#185fa5;color:#fff;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.btn-save:hover{background:#0c447c}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <div class="logo">업무 계획표 <span>마감 기반 개인 플래너</span></div>
      <div style="font-size:12px;color:var(--text3);margin-top:3px" id="week-range"></div>
    </div>
    <button class="add-btn" onclick="openModal()">＋ 업무 추가</button>
  </header>

  <div class="stats-row" id="stats-row"></div>

  <div class="section-label">이번 주 배분 현황</div>
  <div class="week-grid" id="week-grid"></div>

  <div class="section-label" style="margin-top:1.5rem">전체 업무 목록</div>
  <div class="task-list" id="task-list"></div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">새 업무 추가</h3>
    <div class="form-row"><label>업무명</label><input id="f-name" placeholder="예: OO도시개발사업 수질 보고서" /></div>
    <div class="form-row"><label>마감일</label><input id="f-due" type="date" /></div>
    <div class="form-row">
      <label>예상 총 소요시간</label>
      <div class="range-row">
        <input type="range" id="f-hours" min="1" max="100" value="16" step="1" oninput="document.getElementById('f-hours-val').textContent=this.value+'h'">
        <span class="range-val" id="f-hours-val">16h</span>
      </div>
    </div>
    <div class="form-row">
      <label>현재 진행률</label>
      <div class="range-row">
        <input type="range" id="f-prog" min="0" max="100" value="0" step="5" oninput="document.getElementById('f-prog-val').textContent=this.value+'%'">
        <span class="range-val" id="f-prog-val">0%</span>
      </div>
    </div>
    <div class="form-row"><label>비고 (선택)</label><textarea id="f-note" placeholder="담당자, 참고사항 등"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" onclick="saveTask()">저장</button>
    </div>
  </div>
</div>

<script>
const COLORS=['#7F77DD','#1D9E75','#D85A30','#378ADD','#BA7517','#D4537E','#639922','#E24B4A'];
const DAILY_HRS=5.5;
const STORAGE_KEY='work-planner-tasks';

let tasks=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
let editIdx=null;

const TODAY=new Date();TODAY.setHours(0,0,0,0);

function getMonday(d){const r=new Date(d);const day=r.getDay();r.setDate(r.getDate()-day+(day===0?-6:1));r.setHours(0,0,0,0);return r;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function diffDays(a,b){return Math.ceil((a-b)/86400000);}
function fmtShort(d){return `${d.getMonth()+1}/${d.getDate()}`;}
function fmtFull(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks));}

function urgencyOf(t){
  const due=new Date(t.due+'T00:00:00');due.setHours(0,0,0,0);
  const rem=diffDays(due,TODAY);
  const remHrs=t.hours*(1-t.prog/100);
  const avail=Math.max(rem,0)*DAILY_HRS;
  if(rem<=2||avail<remHrs*0.8)return'urgent';
  if(rem<=5||avail<remHrs*1.3)return'warn';
  return'ok';
}
function dailyHrsNeeded(t){
  const due=new Date(t.due+'T00:00:00');due.setHours(0,0,0,0);
  const rem=Math.max(diffDays(due,TODAY),1);
  return(t.hours*(1-t.prog/100)/rem).toFixed(1);
}

function renderStats(){
  const urgent=tasks.filter(t=>urgencyOf(t)==='urgent').length;
  const totalRem=tasks.reduce((s,t)=>s+t.hours*(1-t.prog/100),0);
  const avgProg=tasks.length?Math.round(tasks.reduce((s,t)=>s+t.prog,0)/tasks.length):0;
  document.getElementById('stats-row').innerHTML=`
    <div class="stat"><div class="stat-label">전체 업무</div><div class="stat-val">${tasks.length}건</div></div>
    <div class="stat"><div class="stat-label">긴급 마감</div><div class="stat-val" style="color:#e24b4a">${urgent}건</div></div>
    <div class="stat"><div class="stat-label">잔여 총 시간</div><div class="stat-val">${Math.round(totalRem)}h</div></div>
    <div class="stat"><div class="stat-label">평균 진행률</div><div class="stat-val">${avgProg}%</div></div>
  `;
}

function renderWeekGrid(){
  const MON=getMonday(TODAY);
  const FRI=addDays(MON,4);
  document.getElementById('week-range').textContent=`${fmtFull(MON)} – ${fmtFull(FRI)} 주간`;
  const days=['월','화','수','목','금'];
  const dayLoad=Array(5).fill(0);
  const dayChips=Array(5).fill(null).map(()=>[]);
  tasks.forEach((t,i)=>{
    const due=new Date(t.due+'T00:00:00');due.setHours(0,0,0,0);
    const remHrs=t.hours*(1-t.prog/100);
    if(remHrs<=0)return;
    const color=COLORS[i%COLORS.length];
    for(let d=0;d<5;d++){
      const dd=addDays(MON,d);
      if(dd<TODAY||dd>due)continue;
      dayChips[d].push({name:t.name,color});
      dayLoad[d]+=parseFloat(dailyHrsNeeded(t));
    }
  });
  document.getElementById('week-grid').innerHTML=days.map((day,d)=>{
    const dd=addDays(MON,d);
    const isPast=dd<TODAY;
    const isToday=dd.getTime()===TODAY.getTime();
    const load=dayLoad[d];
    const over=load>DAILY_HRS;
    const chips=dayChips[d].map(c=>`<div class="day-chip" style="background:${c.color}">${c.name.length>11?c.name.slice(0,10)+'…':c.name}</div>`).join('');
    return`<div class="day-col" style="opacity:${isPast?0.4:1}">
      <div class="day-head${isToday?' today':''}">${day} ${fmtShort(dd)}${isToday?' ●':''}</div>
      <div class="day-tasks">${chips||'<div style="font-size:10px;text-align:center;color:var(--text3);margin-top:12px">-</div>'}</div>
      <div class="day-load" style="color:${over?'#e24b4a':'var(--text3)'}">${load>0?load.toFixed(1)+'h'+(over?' ⚠':''):'-'}</div>
    </div>`;
  }).join('');
}

function renderList(){
  const el=document.getElementById('task-list');
  if(!tasks.length){
    el.innerHTML=`<div class="empty">＋ 업무 추가 버튼으로 첫 업무를 등록하세요</div>`;
    return;
  }
  const sorted=[...tasks].map((t,i)=>({...t,_i:i})).sort((a,b)=>{
    const o={urgent:0,warn:1,ok:2};
    return o[urgencyOf(a)]-o[urgencyOf(b)]||new Date(a.due)-new Date(b.due);
  });
  el.innerHTML=sorted.map(t=>{
    const u=urgencyOf(t);
    const due=new Date(t.due+'T00:00:00');due.setHours(0,0,0,0);
    const remDays=diffDays(due,TODAY);
    const remHrs=(t.hours*(1-t.prog/100)).toFixed(1);
    const color=COLORS[t._i%COLORS.length];
    const badgeCls=u==='urgent'?'badge-urgent':u==='warn'?'badge-warn':'badge-ok';
    const badgeTxt=u==='urgent'?'긴급':u==='warn'?'주의':'여유';
    return`<div class="task-card ${u}">
      <div class="task-header">
        <div style="display:flex;align-items:center;gap:8px;flex:1">
          <span class="dot" style="background:${color}"></span>
          <div class="task-name">${t.name}</div>
        </div>
        <div class="task-actions">
          <button class="icon-btn" onclick="openModal(${t._i})" title="수정">✎</button>
          <button class="icon-btn" onclick="deleteTask(${t._i})" title="삭제">✕</button>
        </div>
      </div>
      <div class="task-meta">
        <span>📅 마감 ${t.due} (D-${Math.max(remDays,0)})</span>
        <span class="badge ${badgeCls}">${badgeTxt}</span>
        <span>일 ${dailyHrsNeeded(t)}h 필요 · 잔여 ${remHrs}h</span>
        ${t.note?`<span style="color:var(--text3)">${t.note}</span>`:''}
      </div>
      <div class="progress-row">
        <div class="prog-bg"><div class="prog-fill" style="width:${t.prog}%;background:${color}"></div></div>
        <div class="prog-label">${t.prog}%</div>
      </div>
    </div>`;
  }).join('');
}

function render(){renderStats();renderWeekGrid();renderList();}

function openModal(idx=null){
  editIdx=idx;
  document.getElementById('modal-title').textContent=idx!==null?'업무 수정':'새 업무 추가';
  if(idx!==null){
    const t=tasks[idx];
    document.getElementById('f-name').value=t.name;
    document.getElementById('f-due').value=t.due;
    document.getElementById('f-hours').value=t.hours;
    document.getElementById('f-hours-val').textContent=t.hours+'h';
    document.getElementById('f-prog').value=t.prog;
    document.getElementById('f-prog-val').textContent=t.prog+'%';
    document.getElementById('f-note').value=t.note||'';
  }else{
    document.getElementById('f-name').value='';
    const nd=new Date(TODAY);nd.setDate(nd.getDate()+7);
    document.getElementById('f-due').value=nd.toISOString().slice(0,10);
    document.getElementById('f-hours').value=16;
    document.getElementById('f-hours-val').textContent='16h';
    document.getElementById('f-prog').value=0;
    document.getElementById('f-prog-val').textContent='0%';
    document.getElementById('f-note').value='';
  }
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),100);
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');editIdx=null;}
function saveTask(){
  const name=document.getElementById('f-name').value.trim();
  const due=document.getElementById('f-due').value;
  if(!name||!due){alert('업무명과 마감일을 입력해 주세요.');return;}
  const t={name,due,hours:parseInt(document.getElementById('f-hours').value),prog:parseInt(document.getElementById('f-prog').value),note:document.getElementById('f-note').value.trim()};
  if(editIdx!==null)tasks[editIdx]=t;else tasks.push(t);
  save();closeModal();render();
}
function deleteTask(idx){
  if(!confirm('삭제하시겠습니까?'))return;
  tasks.splice(idx,1);save();render();
}
document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
render();
</script>
</body>
</html>
